<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'titles.dashboard' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (user(); as user) {
    @if (isAdmin()) {
      <app-admin-dashboard></app-admin-dashboard>
    } @else {
      <app-employee-home [userName]="user.user_name"></app-employee-home>
    }
  } @else if (loadFailed()) {
    <div class="ion-text-center ion-padding">
      <ion-text color="danger">
        <p>{{ 'errors.SERVER_NOT_REACHED' | translate }}</p>
      </ion-text>
      <ion-button fill="outline" (click)="refresh()">{{ 'errors.RETRY' | translate }}</ion-button>
    </div>
  } @else {
    <div class="ion-text-center ion-padding">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  }
</ion-content>
