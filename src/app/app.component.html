<ion-app>
  <ion-split-pane
    contentId="main-content"
    [disabled]="isMenuHidden()"
    (ionSplitPaneVisible)="isPaneVisible.set($event.detail.visible)">
    <ion-menu contentId="main-content" type="overlay" [class.collapsed]="isNarrow" [disabled]="isMenuHidden()">
      <ion-content>
        <div class="menu-container">

          <div class="menu-top">
            <ion-list id="inbox-list">
              <div class="menu-header-row">
                @if (!isNarrow) {
                  <ion-list-header>SAYC</ion-list-header>
                }
                <button
                  type="button"
                  class="collapse-button"
                  [title]="'toggle_menu' | translate"
                  [attr.aria-label]="'toggle_menu' | translate"
                  [attr.aria-expanded]="!isNarrow"
                  (click)="toggleCollapse()">
                  <ion-icon aria-hidden="true" name="menu-outline"></ion-icon>
                </button>
              </div>

              @if (!isNarrow) {
                <ion-note>{{ 'welcome_subtitle' | translate }}</ion-note>
              }
              
              @for (p of appPages(); track p.url) {
                <ion-menu-toggle auto-hide="false">
                  <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false"
                    routerLinkActive="selected" [title]="p.title | translate">
                    <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'"
                      [md]="p.icon + '-sharp'"></ion-icon>
                    <ion-label>{{ p.title | translate }}</ion-label>
                  </ion-item>
                </ion-menu-toggle>
              }
            </ion-list>
          </div>

          <div class="menu-footer">
            <ion-list>
              <ion-item id="menu-language" lines="none" button [detail]="false" [title]="'lang' | translate">
                <ion-icon aria-hidden="true" slot="start" name="language-outline"></ion-icon>
                <ion-label>{{ 'lang' | translate }}</ion-label>
              </ion-item>
              <ion-popover class="menu-flyout" trigger="menu-language" side="right" alignment="end" [dismissOnSelect]="true">
                <ng-template>
                  <app-preference-options kind="language"></app-preference-options>
                </ng-template>
              </ion-popover>

              <ion-item id="menu-theme" lines="none" button [detail]="false" [title]="'theme' | translate">
                <ion-icon aria-hidden="true" slot="start" name="color-palette-outline"></ion-icon>
                <ion-label>{{ 'theme' | translate }}</ion-label>
              </ion-item>
              <ion-popover class="menu-flyout" trigger="menu-theme" side="right" alignment="end" [dismissOnSelect]="true">
                <ng-template>
                  <app-preference-options kind="theme"></app-preference-options>
                </ng-template>
              </ion-popover>

              <ion-menu-toggle auto-hide="false">
                <ion-item class="logout-item" lines="none" button [detail]="false" (click)="confirmLogout()" [title]="'close_session' | translate">
                  <ion-icon aria-hidden="true" slot="start" name="log-out-outline"></ion-icon>
                  <ion-label>{{ 'close_session' | translate }}</ion-label>
                </ion-item>
              </ion-menu-toggle>
            </ion-list>
          </div>
        </div>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
